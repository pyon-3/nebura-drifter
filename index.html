<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#02030a" />
    <title>NEBURA DRIFTER</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="brand">NEBURA <b>DRIFTER</b></div>
      <div class="score"><span id="score">000000</span><small>DRIFT PTS</small></div>
      <div class="position"><span id="position">8</span><small>/ 8 POSITION</small></div>
      <div class="lap">LAP <span id="lap">1</span><small>/ <span id="totalLaps">5</span></small></div>
      <div class="speed">
        <small>SPEED</small>
        <div><span id="speed">000</span><em>KM/H</em></div>
        <i><b id="speedBar"></b></i>
      </div>
      <div id="status">CHASE THE AFTERIMAGE</div>
      <div id="radioCall"><small>NEBURA FM // 98.7</small><b></b></div>
      <div id="minimap"><svg viewBox="0 0 100 100"><path id="minimapTrack"></path><circle id="minimapLead" r="2"></circle><circle id="minimapPlayer" r="2.6"></circle></svg><small>COURSE SIGNAL</small></div>
      <div id="offroadVignette"></div>
      <div id="announcement"></div>
      <button id="skipReplay">SKIP REPLAY</button>
      <button id="restartRace">RESTART</button>
      <button id="audioToggle" aria-label="Settings">SETTINGS</button>
      <button id="pauseButton" aria-label="Pause">PAUSE</button>
      <div id="steering">
        <div id="steeringKnob"></div>
        <small>STEER</small>
      </div>
      <div id="pedals">
        <button id="brake">BRAKE</button>
        <button id="gas">GAS</button>
      </div>
    </div>
    <div id="settingsScreen">
      <div class="settings-card">
        <div class="settings-head"><b>SETTINGS</b><button id="closeSettings">CLOSE</button></div>
        <label><span>BGM VOLUME <output id="bgmValue">68</output></span><input id="bgmVolume" type="range" min="0" max="100" value="68" /></label>
        <label><span>SFX VOLUME <output id="sfxValue">48</output></span><input id="sfxVolume" type="range" min="0" max="100" value="48" /></label>
        <small>Settings are saved on this device.</small>
      </div>
    </div>
    <div id="pauseScreen">
      <div class="pause-card">
        <b>PAUSED</b>
        <button id="resumeButton">RESUME</button>
        <button id="restartButton">RESTART RACE</button>
      </div>
    </div>
    <div id="title">
      <h1>NEBURA<br /><b>DRIFTER</b></h1>
      <p>FOLLOW THE RED AFTERIMAGE</p>
      <button id="goCourseSelect">COURSE SELECT</button>
      <small>PRESS TO PICK A COURSE</small>
    </div>
    <div id="courseSelect" class="screen hidden">
      <h1>COURSE<br /><b>SELECT</b></h1>
      <div id="timeSelect">
        <button class="time-card selected" data-time="night">night</button>
        <button class="time-card" data-time="dusk">dusk</button>
      </div>
      <div id="stageSelect">
        <button class="stage-card selected" data-stage="0"><b>NEON GRID</b><small>2.0 KM // HIGH SPEED</small></button>
        <button class="stage-card" data-stage="1"><b>RIDGE HELIX</b><small>2.4 KM // TECHNICAL</small></button>
        <button class="stage-card" data-stage="2"><b>BLUE NEON SHIFT</b><small>3.6 KM // EXPERT // 2 LAPS</small></button>
        <button class="stage-card" data-stage="3"><b>QUIET LAKE</b><small>4.2 KM // EXTREME // 2 LAPS</small></button>
      </div>
      <button id="enterGrid">ENTER GRID</button>
      <button id="backToTitle">BACK</button>
      <small>SELECT STAGE // THEN ENTER GRID</small>
    </div>
    <audio id="bgm1" loop preload="none" src="/Nebura_Drifter.mp3"></audio>
    <audio id="bgm2" loop preload="none" src="/midnight_run_Remix.mp3"></audio>
    <audio id="bgm3" loop preload="none" src="/Blue_Neon_Shift.mp3"></audio>
    <audio id="bgm4" loop preload="none" src="/kamikaze_rumble.mp3"></audio>
    <audio id="duskBgm" loop preload="none" src="/evening_velocity.mp3"></audio>
    <audio id="finishBgm" loop preload="none" src="/Nebura_Afterglow.mp3"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
